<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" width="100%" height="100%">
  <!-- Base grid structure -->
  <path d="
    M100 20 H180
    M60 60 H220
    M20 100 H260
    M20 140 H260
    M20 180 H260
    M60 220 H220
    M100 260 H180

    M100 20 V260
    M140 20 V260
    M180 20 V260
    M60 60 V220
    M220 60 V220
    M20 100 V180
    M260 100 V180
  " stroke="#2E2E30" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Accent geometry for The Auto Pilot -->
  <g stroke="#542bff" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <!-- Flowchart shapes -->
    <rect x="100" y="80" width="40" height="30" />
    <polygon points="160,95 180,85 180,105" />
    <rect x="200" y="80" width="40" height="30" />

    <!-- Connecting arrows -->
    <line x1="140" y1="95" x2="160" y2="95" />
    <line x1="180" y1="95" x2="200" y2="95" />

    <!-- Robotic arm motif -->
    <line x1="140" y1="140" x2="140" y2="180" />
    <circle cx="140" cy="180" r="12" />
    <line x1="140" y1="180" x2="160" y2="200" />
    <circle cx="160" cy="200" r="8" />
  </g>
</svg>
