<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" width="100%" height="100%">
  <!-- Base grid structure -->
  <path d="
    M100 20 H180
    M60 60 H220
    M20 100 H260
    M20 140 H260
    M20 180 H260
    M60 220 H220
    M100 260 H180

    M100 20 V260
    M140 20 V260
    M180 20 V260
    M60 60 V220
    M220 60 V220
    M20 100 V180
    M260 100 V180
  " stroke="#2E2E30" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Accent geometry for The Gatekeeper -->
  <g stroke="#542bff" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <!-- Shield outline -->
    <polygon points="140,60 200,120 180,200 100,200 80,120" />

    <!-- Keyhole -->
    <circle cx="140" cy="140" r="12" />
    <line x1="140" y1="128" x2="140" y2="152" />

    <!-- Identity nodes -->
    <circle cx="110" cy="110" r="8" />
    <circle cx="170" cy="110" r="8" />
    <line x1="110" y1="110" x2="170" y2="110" />
  </g>
</svg>
