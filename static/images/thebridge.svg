<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" width="100%" height="100%">
  <!-- Base grid structure -->
  <path d="
    M100 20 H180
    M60 60 H220
    M20 100 H260
    M20 140 H260
    M20 180 H260
    M60 220 H220
    M100 260 H180

    M100 20 V260
    M140 20 V260
    M180 20 V260
    M60 60 V220
    M220 60 V220
    M20 100 V180
    M260 100 V180
  " stroke="#2E2E30" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Accent geometry for The Bridge -->
  <g stroke="#542bff" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <!-- Arched bridge motif -->
    <path d="M60 140 Q140 60 220 140" />
    <path d="M60 180 Q140 100 220 180" />

    <!-- Vertical supports -->
    <line x1="100" y1="140" x2="100" y2="180" />
    <line x1="140" y1="100" x2="140" y2="180" />
    <line x1="180" y1="140" x2="180" y2="180" />

    <!-- Base line -->
    <line x1="60" y1="180" x2="220" y2="180" />
  </g>
</svg>
