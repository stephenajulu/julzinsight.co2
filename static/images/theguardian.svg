<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" width="100%" height="100%">
  <!-- Base grid structure -->
  <path d="
    M100 20 H180
    M60 60 H220
    M20 100 H260
    M20 140 H260
    M20 180 H260
    M60 220 H220
    M100 260 H180

    M100 20 V260
    M140 20 V260
    M180 20 V260
    M60 60 V220
    M220 60 V220
    M20 100 V180
    M260 100 V180
  " stroke="#2E2E30" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Accent geometry for The Guardian -->
  <g stroke="#542bff" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <!-- Radar circle -->
    <circle cx="140" cy="140" r="60" />
    <circle cx="140" cy="140" r="30" />

    <!-- Radar sweep line -->
    <line x1="140" y1="140" x2="200" y2="100" />

    <!-- Heartbeat line -->
    <polyline points="80,180 100,160 120,180 140,140 160,160 180,140 200,160" />
  </g>
</svg>
