<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" width="100%" height="100%">
  <!-- Base grid structure -->
  <path d="
    M100 20 H180
    M60 60 H220
    M20 100 H260
    M20 140 H260
    M20 180 H260
    M60 220 H220
    M100 260 H180

    M100 20 V260
    M140 20 V260
    M180 20 V260
    M60 60 V220
    M220 60 V220
    M20 100 V180
    M260 100 V180
  " stroke="#2E2E30" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Accent geometry for The Citadel -->
  <g stroke="#542bff" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <!-- Fortress outline -->
    <polygon points="100,100 180,100 180,180 100,180" />
    <rect x="120" y="120" width="40" height="40" />

    <!-- Battlements -->
    <line x1="100" y1="100" x2="110" y2="90" />
    <line x1="120" y1="100" x2="130" y2="90" />
    <line x1="140" y1="100" x2="150" y2="90" />
    <line x1="160" y1="100" x2="170" y2="90" />
    <line x1="180" y1="100" x2="190" y2="90" />

    <!-- Network nodes -->
    <circle cx="80" cy="140" r="8" />
    <circle cx="200" cy="140" r="8" />
    <line x1="80" y1="140" x2="100" y2="140" />
    <line x1="180" y1="140" x2="200" y2="140" />
  </g>
</svg>
