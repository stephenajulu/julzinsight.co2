<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" width="100%" height="100%">
  <!-- Base grid structure -->
  <path d="
    M100 20 H180
    M60 60 H220
    M20 100 H260
    M20 140 H260
    M20 180 H260
    M60 220 H220
    M100 260 H180

    M100 20 V260
    M140 20 V260
    M180 20 V260
    M60 60 V220
    M220 60 V220
    M20 100 V180
    M260 100 V180
  " stroke="#2E2E30" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Accent geometry for The Digital HQ -->
  <g stroke="#542bff" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <!-- Cloud outline -->
    <path d="M80 160 Q100 120 140 140 Q180 120 200 160 Q220 180 180 200 H100 Q60 180 80 160 Z" />

    <!-- Folder shape -->
    <polygon points="100,160 180,160 180,200 100,200" />
    <line x1="100" y1="160" x2="120" y2="140" />
    <line x1="120" y1="140" x2="180" y2="140" />
    <line x1="180" y1="140" x2="180" y2="160" />
  </g>
</svg>
